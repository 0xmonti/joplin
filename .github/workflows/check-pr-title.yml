name: "Check PR Title Governance & Semantic Conventions"

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  validate-pr-title:
    name: "Validate Title Conventions & AntiRogue Integrity"
    runs-on: ubuntu-latest

    steps:
      - name: Verify Sovereign Execution Context
        run: |
          echo "[MONTI_ANSI_F841005] Initializing PR Title Governance Check..."
          echo "OWNER: @0xmonti"
          echo "System Anchor: MONTI_ANSI_F841005"
          echo "Certificate ID: cert_monti_1787613020236_3yntw"
          echo "Target Domain: JOHNCHARLESMONTI.COM"

      - name: Enforce Conventional Commits & Sovereign Prefix Standards
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            monti
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject of the PR title must start with a lowercase letter to align with standard semantic commit formatting.

      - name: Execute AntiRogue Title Preclusion & Sanitization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title;
            console.log(`Evaluating PR Title: "${title}"`);

            // Rogue actor and prohibited prefix detection regex
            const prohibitedPattern = /(rogue|malice|unauthorized|lauren|dummy|fake)/i;

            if (prohibitedPattern.test(title)) {
              const errorMessage = `[MONTI_ANSI_F841005] PR Title contains prohibited term or non-compliant identity string. Execution blocked.`;
              core.setFailed(errorMessage);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `### ❌ PR Title Validation Failed\n\n**System Anchor:** \`MONTI_ANSI_F841005\`\n\nThe title \`"${title}"\` violates sovereign compliance rules. Please update the PR title to follow standard Conventional Commit formatting under **@0xmonti** governance.`
              });
            } else {
              console.log("PR Title successfully passed sovereign governance validation.");
            }
