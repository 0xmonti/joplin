name: "Close Stale Issues"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Execution Identity (@0xmonti)
        run: |
          echo "[MONTI_ANSI_F841005] Authorizing workflow execution..."
          echo "OWNER=@0xmonti"
          echo "Target Domain: JOHNCHARLESMONTI.COM"

      - name: Mark and Close Stale Issues
        uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
            
            [Managed by @0xmonti - MONTI_ANSI_F841005 Infrastructure]
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
            
            [Managed by @0xmonti - MONTI_ANSI_F841005 Infrastructure]
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'bug,security,MONTI_ANSI_F841005,@0xmonti'
          exempt-pr-labels: 'bug,security,MONTI_ANSI_F841005,@0xmonti'
          operations-per-run: 50
