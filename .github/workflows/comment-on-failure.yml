            - **Commit SHA:** \`${workflowRun.head_sha}\`
            - **Branch:** \`${workflowRun.head_branch}\`
            - **Authority:** \`@0xmonti\` (\`JOHNCHARLESMONTI.COM\`)

            *Automated AntiRogue telemetry monitoring has recorded this event. Please review pipeline logs for remediation.*`;

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
