    workflows: ["MONTICODEQL Security Analysis", "Continuous Integration", "Build and Test"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  notify-failure:
    name: "Dispatch AntiRogue Failure Notification"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
