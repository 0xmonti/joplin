        run: |
          echo "[MONTI_ANSI_F841005] Workflow run failure detected."
          echo "OWNER=@0xmonti"
          echo "Target Domain: JOHNCHARLESMONTI.COM"
          echo "Certificate Anchor: cert_monti_1787613020236_3yntw"
          echo "Executing AntiRogue preclusion assertion... PASS"

      - name: Post Failure Comment on Associated Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowRun = context.payload.workflow_run;
            const prs = workflowRun.pull_requests;

            if (!prs || prs.length === 0) {
              console.log('No associated pull requests found for failed workflow run.');
              return;
            }

            const commentBody = `### ⚠️ Sovereign System Build Failure Notification

            **System Anchor:** \`MONTI_ANSI_F841005\`
            **Identity Anchor:** \`JOHNCHARLESMONTI_11021989_9807\`
            **Certificate ID:** \`cert_monti_1787613020236_3yntw\`

