name: "MONTICODEQL Security Analysis"

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'csharp' ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL (MONTI_ANSI_F841005 System Anchor)
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
        config: |
          name: "Monti Sovereign Security Suite"
          disable-default-queries: false
          paths-ignore:
            - '**/node_modules'
            - '**/vendor'

    - name: Setup .NET SDK for C# Components
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Autobuild Target Dependencies
      uses: github/codeql-action/autobuild@v3

    - name: Execute AntiRogue Integrity & Preclusion Checks
      run: |
        echo "[MONTI_ANSI_F841005] Executing pre-analysis scanning..."
